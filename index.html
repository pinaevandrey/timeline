<!DOCTYPE html>
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Лента времени</title>
<style>
:root{
  --bg:#eef1f7;
  --ink:#252936;
  --muted:#70768a;
  --glass:rgba(255,255,255,.42);
  --glass-strong:rgba(255,255,255,.68);
  --border:rgba(255,255,255,.72);
  --purple:#7657ee;
  --purple2:#9b78ff;
  --red:#e45768;
  --red2:#ff7b88;
  --shadow:0 18px 45px rgba(72,68,104,.16), inset 0 1px 0 rgba(255,255,255,.85);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;font-family:"Segoe UI",Inter,Arial,sans-serif;color:var(--ink)}
body{
  overflow:hidden;
  background:
    radial-gradient(circle at 15% 10%,rgba(255,214,205,.72),transparent 31%),
    radial-gradient(circle at 82% 18%,rgba(193,215,255,.65),transparent 30%),
    radial-gradient(circle at 78% 85%,rgba(188,239,255,.58),transparent 28%),
    linear-gradient(135deg,#f5f1f0,#e9eef7 55%,#f5edf4);
}
body:before{
  content:"";position:fixed;inset:-20%;
  background:radial-gradient(circle at 50% 50%,rgba(255,255,255,.34),transparent 45%);
  pointer-events:none;
}
.header{
  height:76px;padding:18px 28px;display:flex;align-items:center;
  position:relative;z-index:50;
}
.header h1{margin:0;font-size:28px;font-weight:700;letter-spacing:-.7px}
.toolbar{
  position:relative;z-index:45;margin:0 24px 12px;padding:10px 12px;
  display:flex;align-items:center;gap:9px;flex-wrap:wrap;
  background:var(--glass);border:1px solid var(--border);border-radius:24px;
  box-shadow:var(--shadow);backdrop-filter:blur(24px) saturate(135%);
  -webkit-backdrop-filter:blur(24px) saturate(135%);
}
.glass-btn,.track-tab{
  border:1px solid rgba(255,255,255,.78);
  background:linear-gradient(145deg,rgba(255,255,255,.72),rgba(255,255,255,.35));
  color:#353847;padding:10px 15px;border-radius:18px;cursor:pointer;
  box-shadow:0 8px 20px rgba(72,68,104,.10),inset 0 1px 0 #fff;
  font:600 13px inherit;transition:.2s ease;white-space:nowrap;
}
.glass-btn:hover,.track-tab:hover{transform:translateY(-1px);box-shadow:0 12px 24px rgba(72,68,104,.16),inset 0 1px 0 #fff}
.icon-btn{width:42px;height:38px;padding:0;font-size:21px}
.primary{background:linear-gradient(135deg,rgba(118,87,238,.92),rgba(155,120,255,.78));color:#fff;text-shadow:0 1px 3px rgba(40,25,100,.22)}
.danger{background:linear-gradient(135deg,rgba(255,255,255,.75),rgba(255,220,225,.48));color:#c63d4f}
.pdf{background:linear-gradient(135deg,rgba(213,229,255,.72),rgba(255,255,255,.45))}
.zoom-info{min-width:78px;text-align:center;color:#666b7d;font-size:12px;font-weight:600}
.spacer{flex:1}
.switcher{
  display:flex;gap:7px;padding:5px;border-radius:20px;
  background:rgba(255,255,255,.3);border:1px solid rgba(255,255,255,.6)
}
.track-tab{padding:8px 13px;border-radius:15px;background:transparent;box-shadow:none;border-color:transparent}
.track-tab.active.world{background:linear-gradient(135deg,rgba(118,87,238,.9),rgba(155,120,255,.76));color:#fff}
.track-tab.active.russia{background:linear-gradient(135deg,rgba(228,87,104,.92),rgba(255,123,136,.76));color:#fff}
.wrap{
  position:absolute;left:0;right:0;top:135px;bottom:0;overflow:auto;
  cursor:grab;padding-bottom:25px;
}
.wrap.drag{cursor:grabbing}
.scene{
  position:relative;min-height:300px;
  background:rgba(255,255,255,.15);
  padding-left:1.5cm;
  padding-right:1.5cm;
  box-sizing:content-box;
}
.track{
  position:absolute;left:0;height:120px;z-index:2;
}
.track.world{top:30%;}.track.russia{top:70%}
.line{
  position:absolute;left:0;top:50%;height:5px;border-radius:8px;
  box-shadow:0 0 16px rgba(0,0,0,.13),0 0 35px currentColor;
}
.world .line{background:linear-gradient(90deg,var(--purple),var(--purple2));color:rgba(118,87,238,.35)}
.russia .line{background:linear-gradient(90deg,var(--red),var(--red2));color:rgba(228,87,104,.32)}
.russia .line:before{
  content:"";position:absolute;right:100%;width:0;height:100%;
}
.track-name{
  display:none;
}
.tick{position:absolute;top:50%;width:2px;height:15px;transform:translateY(-50%);z-index:3;border-radius:4px}
.world .tick{background:var(--purple)}.russia .tick{background:var(--red)}
.tick-label{position:absolute;top:50%;transform:translate(-50%,13px);font-size:12px;font-weight:700;white-space:nowrap;z-index:3}
.world .tick-label{color:#6246d8}.russia .tick-label{color:#c83e52}
.start-label{
  position:absolute;top:50%;transform:translate(-50%,-42px);
  font-size:11px;font-weight:700;white-space:nowrap;padding:5px 9px;border-radius:12px;
  background:rgba(255,255,255,.52);border:1px solid rgba(255,255,255,.7);
}
.russia .start-label{color:#c83e52}
.card{
  position:absolute;width:220px;padding:11px;border-radius:20px;
  background:linear-gradient(145deg,rgba(255,255,255,.72),rgba(255,255,255,.38));
  border:1px solid rgba(255,255,255,.82);box-shadow:var(--shadow);
  backdrop-filter:blur(18px) saturate(135%);-webkit-backdrop-filter:blur(18px);
  display:flex;flex-direction:column;gap:5px;z-index:10;transition:.2s ease;
  transform:translateX(-50%);cursor:pointer;
}
.card:hover{transform:translateX(-50%) translateY(-3px);z-index:20;box-shadow:0 25px 55px rgba(72,68,104,.22),inset 0 1px 0 #fff}
.card.up{bottom:50%;margin-bottom:28px}.card.down{top:50%;margin-top:28px}
.card:after{content:"";position:absolute;left:50%;width:2px;height:28px;transform:translateX(-50%);opacity:.8}
.world .card:after{background:var(--purple)}.russia .card:after{background:var(--red)}
.card.up:after{bottom:-28px}.card.down:after{top:-28px}
.dot{
  position:absolute;left:50%;width:12px;height:12px;border-radius:50%;
  transform:translate(-50%,-50%);z-index:15;border:3px solid rgba(255,255,255,.9);
  box-shadow:0 0 0 5px rgba(255,255,255,.14),0 3px 10px rgba(0,0,0,.15)
}
.card.up .dot{bottom:-36px}.card.down .dot{top:-36px}
.world .dot{background:var(--purple)}.russia .dot{background:var(--red)}
.acts{position:absolute;right:8px;top:7px;display:flex;gap:4px;opacity:0;transition:.2s}
.card:hover .acts{opacity:1}
.ib{
  width:28px;height:28px;padding:0;border-radius:50%;border:1px solid rgba(255,255,255,.8);
  background:rgba(255,255,255,.72);cursor:pointer;font-size:13px;box-shadow:0 5px 12px rgba(0,0,0,.08)
}
.ib.del{color:#d13e50}
.ci{width:100%;height:105px;object-fit:cover;border-radius:13px;background:#e8e8ee}
.cy{font-size:12px;font-weight:800}.world .cy{color:#6246d8}.russia .cy{color:#c83e52}
.ct{font-size:15px;margin:0;font-weight:750;line-height:1.15}
.empty{
  position:absolute;left:50%;top:49%;transform:translate(-50%,-50%);
  padding:18px 24px;border-radius:22px;background:rgba(255,255,255,.38);
  border:1px solid rgba(255,255,255,.65);backdrop-filter:blur(14px);
  color:#777c8e;font-size:14px;box-shadow:var(--shadow);pointer-events:none;text-align:center;
}
.modal{
  display:none;position:fixed;inset:0;background:rgba(70,72,88,.22);
  z-index:1000;justify-content:center;align-items:center;padding:20px;
  backdrop-filter:blur(8px)
}
.modal.on{display:flex}
.mc{
  width:470px;max-width:96%;max-height:92vh;overflow:auto;padding:25px;border-radius:28px;
  background:linear-gradient(145deg,rgba(255,255,255,.78),rgba(255,255,255,.5));
  border:1px solid rgba(255,255,255,.88);box-shadow:0 30px 80px rgba(55,54,80,.24),inset 0 1px 0 #fff;
  backdrop-filter:blur(25px) saturate(140%)
}
.mc h2{margin:0 0 18px;font-size:22px}
.fg{margin-bottom:14px}.fg label{display:block;margin-bottom:6px;font-size:12px;font-weight:700;color:#555a6b}
.fg input,.fg textarea,.fg select{
  width:100%;padding:11px 12px;border-radius:14px;border:1px solid rgba(180,183,198,.35);
  background:rgba(255,255,255,.64);outline:none;font:14px inherit;color:var(--ink);
  box-shadow:inset 0 1px 3px rgba(80,80,100,.04)
}
.fg input:focus,.fg textarea:focus,.fg select:focus{border-color:rgba(118,87,238,.5);box-shadow:0 0 0 4px rgba(118,87,238,.1)}
.year-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ma{display:flex;justify-content:flex-end;gap:9px;margin-top:18px}
.cancel{background:rgba(255,255,255,.55)}
.hint{font-size:12px;color:#7d8292;line-height:1.4}
.current-image{display:flex;gap:9px;align-items:center;margin-bottom:7px}
.current-image img{width:70px;height:46px;object-fit:cover;border-radius:9px}
.check{font-size:12px;display:flex;align-items:center;gap:7px}
#pdfArea{display:none}

.mc::-webkit-scrollbar,
.side-panel-body::-webkit-scrollbar,
.wrap::-webkit-scrollbar{width:9px;height:9px}
.mc::-webkit-scrollbar-track,
.side-panel-body::-webkit-scrollbar-track,
.wrap::-webkit-scrollbar-track{background:rgba(255,255,255,.25);border-radius:10px}
.mc::-webkit-scrollbar-thumb,
.side-panel-body::-webkit-scrollbar-thumb,
.wrap::-webkit-scrollbar-thumb{
  background:linear-gradient(180deg,rgba(118,87,238,.65),rgba(155,120,255,.5));
  border-radius:10px;border:2px solid rgba(255,255,255,.45);
}
.mc::-webkit-scrollbar-thumb:hover,
.side-panel-body::-webkit-scrollbar-thumb:hover,
.wrap::-webkit-scrollbar-thumb:hover{
  background:linear-gradient(180deg,rgba(118,87,238,.85),rgba(155,120,255,.7));
}
.mc,.side-panel-body,.wrap{scrollbar-width:thin;scrollbar-color:rgba(118,87,238,.65) rgba(255,255,255,.25)}

.side-panel{
  position:fixed;top:0;right:0;bottom:0;width:420px;max-width:92vw;
  background:linear-gradient(145deg,rgba(255,255,255,.86),rgba(255,255,255,.62));
  border-left:1px solid rgba(255,255,255,.9);
  box-shadow:-25px 0 60px rgba(55,54,80,.22);
  backdrop-filter:blur(26px) saturate(140%);
  -webkit-backdrop-filter:blur(26px) saturate(140%);
  z-index:1100;transform:translateX(105%);transition:transform .35s cubic-bezier(.4,0,.2,1);
  display:flex;flex-direction:column;
}
.side-panel.on{transform:translateX(0)}
.side-panel-head{
  display:flex;align-items:flex-start;justify-content:space-between;gap:12px;
  padding:22px 22px 14px;border-bottom:1px solid rgba(180,183,198,.22);
}
.side-panel-head .sp-year{font-size:13px;font-weight:800;margin-bottom:4px}
.side-panel-head .sp-year.world{color:#6246d8}
.side-panel-head .sp-year.russia{color:#c83e52}
.side-panel-head h2{margin:0;font-size:21px;line-height:1.2}
.sp-close{
  flex:0 0 auto;width:38px;height:38px;border-radius:50%;border:1px solid rgba(255,255,255,.8);
  background:rgba(255,255,255,.72);cursor:pointer;font-size:19px;color:#555a6b;
  box-shadow:0 6px 16px rgba(0,0,0,.08);transition:.2s;
}
.sp-close:hover{background:rgba(255,235,238,.85);color:#c63d4f;transform:rotate(90deg)}
.side-panel-body{padding:20px 22px 30px;overflow:auto;flex:1}
.side-panel-body img.sp-img{
  width:100%;max-height:260px;object-fit:cover;border-radius:18px;margin-bottom:16px;
  box-shadow:0 12px 30px rgba(72,68,104,.18);
}
.side-panel-body .sp-desc{font-size:14px;line-height:1.6;color:#4c5163;white-space:pre-wrap}
.side-panel-body .sp-desc.empty-desc{color:#9a9fb0;font-style:italic}
.side-panel-backdrop{
  position:fixed;inset:0;background:rgba(70,72,88,.18);backdrop-filter:blur(3px);
  z-index:1090;opacity:0;pointer-events:none;transition:opacity .35s;
}
.side-panel-backdrop.on{opacity:1;pointer-events:auto}

.user-badge{
  display:none;align-items:center;gap:8px;padding:8px 14px;border-radius:18px;
  background:rgba(255,255,255,.5);border:1px solid rgba(255,255,255,.75);
  font-size:13px;font-weight:700;color:#4c5163;box-shadow:inset 0 1px 0 #fff;
}
.user-badge.on{display:flex}
.avatar{
  width:26px;height:26px;border-radius:50%;display:grid;place-items:center;
  background:linear-gradient(135deg,var(--purple),var(--purple2));color:#fff;
  font-size:12px;font-weight:800;text-transform:uppercase;
}
.auth-tab-row{display:flex;gap:8px;margin-bottom:18px}
.auth-tab{
  flex:1;padding:10px;border-radius:14px;border:1px solid rgba(255,255,255,.8);
  background:rgba(255,255,255,.45);cursor:pointer;font:700 13px inherit;color:#555a6b;transition:.2s;
}
.auth-tab.active{background:linear-gradient(135deg,rgba(118,87,238,.9),rgba(155,120,255,.76));color:#fff}
.auth-err{color:#c63d4f;font-size:12px;font-weight:600;min-height:16px;margin-top:6px}
.saved-list{display:flex;flex-direction:column;gap:10px}
.saved-item{
  display:flex;align-items:center;justify-content:space-between;gap:10px;
  padding:13px 15px;border-radius:16px;background:rgba(255,255,255,.55);
  border:1px solid rgba(255,255,255,.8);box-shadow:0 8px 20px rgba(72,68,104,.08);
}
.saved-item .si-info{min-width:0}
.saved-item .si-name{font-size:14px;font-weight:750;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.saved-item .si-meta{font-size:11px;color:#7d8292;margin-top:3px}
.saved-item .si-actions{display:flex;gap:6px;flex:0 0 auto}
.si-btn{
  padding:7px 11px;border-radius:12px;border:1px solid rgba(255,255,255,.8);cursor:pointer;
  font:700 12px inherit;background:rgba(255,255,255,.7);color:#4c5163;transition:.2s;
}
.si-btn:hover{transform:translateY(-1px)}
.si-btn.load{background:linear-gradient(135deg,rgba(118,87,238,.85),rgba(155,120,255,.7));color:#fff}
.si-btn.del{color:#c63d4f}
.saved-empty{color:#7d8292;font-size:13px;text-align:center;padding:20px 0}

@media print{
 @page{size:A4 landscape;margin:10mm}
 html,body{height:auto!important;overflow:visible!important;background:#fff!important}
 body>*:not(#pdfArea){display:none!important}
 #pdfArea{display:block!important}
}
@media(max-width:800px){
 .header{height:64px;padding:14px 18px}.header h1{font-size:23px}
 .toolbar{margin:0 12px 10px;border-radius:20px}
 .wrap{top:125px}.card{width:190px}
 .spacer{display:none}
 .side-panel{width:100%;max-width:100%}
}
</style>
</head>
<body>
<header class="header"><h1>Лента времени</h1></header>

<div class="toolbar">
  <button class="glass-btn icon-btn" onclick="zoom(-1)" title="Уменьшить масштаб">−</button>
  <button class="glass-btn icon-btn" onclick="zoom(1)" title="Увеличить масштаб">+</button>
  <button class="glass-btn" onclick="zoomReset()">Сброс</button>
  <div class="spacer"></div>

  <div class="user-badge" id="userBadge">
    <div class="avatar" id="userAvatar">?</div>
    <span id="userName">—</span>
  </div>
  <button class="glass-btn" id="btnRegister" onclick="openAuth('register')">Зарегистрироваться</button>
  <button class="glass-btn" id="btnLogin" onclick="openAuth('login')">Войти</button>
  <button class="glass-btn primary" id="btnSave" style="display:none" onclick="saveTimeline()">Сохранить</button>
  <button class="glass-btn pdf" id="btnMy" style="display:none" onclick="openMyTimelines()">Мои ленты</button>
  <button class="glass-btn danger" id="btnLogout" style="display:none" onclick="logout()">Выйти</button>

  <button class="glass-btn primary" onclick="openEv()">＋ Добавить событие</button>
  <button class="glass-btn pdf" onclick="openPdf()">⇩ PDF</button>
  <button class="glass-btn danger" onclick="clearTrack()">Очистить ленту</button>
</div>

<div class="wrap" id="wrap">
  <div class="scene" id="scene">
    <div class="track world" id="worldTrack">
      <div class="line" id="worldLine"></div>
    </div>
    <div class="track russia" id="russiaTrack">
      <div class="line" id="russiaLine"></div>
    </div>
	<div class="empty" id="empty">Выберите ленту и нажмите «Добавить событие»</div>
  </div>
</div>

<div class="side-panel-backdrop" id="panelBackdrop" onclick="closePanel()"></div>
<aside class="side-panel" id="sidePanel" aria-hidden="true">
  <div class="side-panel-head">
    <div>
      <div class="sp-year" id="spYear"></div>
      <h2 id="spTitle"></h2>
    </div>
    <button class="sp-close" onclick="closePanel()" title="Закрыть (Esc)">✕</button>
  </div>
  <div class="side-panel-body" id="spBody"></div>
</aside>

<div class="modal" id="evModal"><div class="mc">
  <h2 id="mt">Новое событие</h2>
  <form id="evForm">
    <input type="hidden" id="eid">
    <div class="fg">
      <label>Лента</label>
      <select id="trackSelect">
        <option value="world">Мировая история</option>
        <option value="russia">История России</option>
      </select>
    </div>
    <div class="fg">
      <label>Дата</label>
      <div class="year-row">
        <input type="number" id="y" required>
        <select id="era">
          <option value="ce">н.э.</option>
          <option value="bce">до н.э.</option>
        </select>
      </div>
      <div class="hint" id="yearHint">Допустимый диапазон: 2000 г. до н.э. — 2026 г.</div>
    </div>
    <div class="fg"><label>Заголовок</label><input type="text" id="t" required></div>
    <div class="fg"><label>Описание</label><textarea id="d" rows="4"></textarea></div>
    <div class="fg"><label>Картинка</label>
      <div class="current-image" id="cib" style="display:none">
        <img id="cip"><label class="check"><input type="checkbox" id="rm"> Удалить текущее</label>
      </div>
      <input type="file" id="if" accept="image/*">
      <input type="text" id="iu" placeholder="или URL изображения" style="margin-top:7px">
    </div>
    <div class="ma">
      <button type="button" class="glass-btn cancel" onclick="closeEv()">Отмена</button>
      <button type="submit" class="glass-btn primary" id="sb">Сохранить</button>
    </div>
  </form>
</div></div>

<div class="modal" id="pdfModal"><div class="mc">
  <h2>Экспорт в PDF</h2>
  <p class="hint">Будет экспортирована активная лента с событиями в выбранном диапазоне.</p>
  <div class="fg">
    <label>Диапазон</label>
    <div class="year-row">
      <input type="text" id="pf" placeholder="От">
      <input type="text" id="pt" placeholder="До">
    </div>
    <div class="hint" id="pi"></div>
  </div>
  <div class="ma">
    <button type="button" class="glass-btn cancel" onclick="closePdf()">Отмена</button>
    <button type="button" class="glass-btn pdf" onclick="doExport()">Скачать PDF</button>
  </div>
</div></div>

<div class="modal" id="authModal"><div class="mc" style="width:420px">
  <h2 id="authTitle">Регистрация</h2>
  <div class="auth-tab-row">
    <button type="button" class="auth-tab" id="tabReg" onclick="switchAuth('register')">Регистрация</button>
    <button type="button" class="auth-tab" id="tabLog" onclick="switchAuth('login')">Вход</button>
  </div>
  <form id="authForm">
    <div class="fg" id="fgName">
      <label>Имя пользователя</label>
      <input type="text" id="auName" autocomplete="username">
    </div>
    <div class="fg">
      <label>Почта</label>
      <input type="email" id="auMail" autocomplete="email" required>
    </div>
    <div class="fg">
      <label>Пароль</label>
      <input type="password" id="auPass" autocomplete="current-password" required>
    </div>
    <div class="auth-err" id="authErr"></div>
    <div class="ma">
      <button type="button" class="glass-btn cancel" onclick="closeAuth()">Отмена</button>
      <button type="submit" class="glass-btn primary" id="authSubmit">Зарегистрироваться</button>
    </div>
  </form>
</div></div>

<div class="modal" id="myModal"><div class="mc" style="width:520px">
  <h2>Мои ленты</h2>
  <div class="saved-list" id="savedList"></div>
  <div class="ma">
    <button type="button" class="glass-btn cancel" onclick="closeMy()">Закрыть</button>
  </div>
</div></div>

<div id="pdfArea"></div>

<!-- ============================================================
     FIREBASE — НЕ ТРОГАЙТЕ НИЧЕГО КРОМЕ БЛОКА firebaseConfig !!!
     ============================================================ -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import {
    getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword,
    signOut, onAuthStateChanged, updateProfile
  } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
  import {
    getFirestore, collection, addDoc, query, where, getDocs, deleteDoc, doc, serverTimestamp
  } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

  /* ============================================================
     ↓↓↓  ВСТАВЬТЕ СЮДА ВАШ firebaseConfig ИЗ ШАГА B  ↓↓↓
     ============================================================ */
  const firebaseConfig = {
  apiKey: "AIzaSyCebBAxkonsKhhU3JIJnJZA2gAmagjsYU8",
  authDomain: "timeline-hist.firebaseapp.com",
  projectId: "timeline-hist",
  storageBucket: "timeline-hist.firebasestorage.app",
  messagingSenderId: "236225190502",
  appId: "1:236225190502:web:082f859be6a63d54776ba7",
  measurementId: "G-F723YWRK95"
  };
  /* ============================================================
     ↑↑↑  КОНЕЦ ВАШЕГО БЛОКА  ↑↑↑
     ============================================================ */

  const app  = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const fs   = getFirestore(app);

  window.__auth = auth;
  window.__fs   = { collection, addDoc, query, where, getDocs, deleteDoc, doc, serverTimestamp, fs };

  onAuthStateChanged(auth, (user) => {

<script>
(function(){
'use strict';

const MIN=-2000, MAX=2026, RUSSIA_START=862;
const Z=[0.5,0.75,1,1.5,2,3,5,8,12,20,35];
const SIDE_PADDING = 1.5 * 37.795;
let zi=parseInt(localStorage.getItem('timeline-zi'),10);
if(isNaN(zi)||zi<0||zi>=Z.length) zi=2;

let activeTrack=localStorage.getItem('timeline-active')||'world';
let db={world:[],russia:[]};
try{ db=Object.assign(db,JSON.parse(localStorage.getItem('timeline-events')||'{}')); }catch(e){}
if(!Array.isArray(db.world))db.world=[];
if(!Array.isArray(db.russia))db.russia=[];

let editingId=null;
const scene=document.getElementById('scene'),wrap=document.getElementById('wrap');
const empty=document.getElementById('empty');
const evModal=document.getElementById('evModal'),pdfModal=document.getElementById('pdfModal');
const evForm=document.getElementById('evForm'),trackSelect=document.getElementById('trackSelect');
const yEl=document.getElementById('y'),eraEl=document.getElementById('era');
const mt=document.getElementById('mt'),sb=document.getElementById('sb');
const cib=document.getElementById('cib'),cip=document.getElementById('cip'),rm=document.getElementById('rm');

let authMode='register';

window.refreshAuthUI = function(){
  const u = window.currentUser;
  const badge = document.getElementById('userBadge');
  const bReg  = document.getElementById('btnRegister');
  const bLog  = document.getElementById('btnLogin');
  const bSave = document.getElementById('btnSave');
  const bMy   = document.getElementById('btnMy');
  const bOut  = document.getElementById('btnLogout');

  if (u) {
    badge.classList.add('on');
    document.getElementById('userName').textContent   = u.name;
    document.getElementById('userAvatar').textContent = u.name.charAt(0).toUpperCase();
    bReg.style.display  = 'none';
    bLog.style.display  = 'none';
    bSave.style.display = '';
    bMy.style.display   = '';
    bOut.style.display  = '';
  } else {
    badge.classList.remove('on');
    bReg.style.display  = '';
    bLog.style.display  = '';
    bSave.style.display = 'none';
    bMy.style.display   = 'none';
    bOut.style.display  = 'none';
  }
};

window.openAuth = function(mode){
  authMode = mode || 'register';
  document.getElementById('authErr').textContent = '';
  document.getElementById('authForm').reset();
  switchAuth(authMode);
  document.getElementById('authModal').classList.add('on');
  setTimeout(()=>document.getElementById(mode==='register'?'auName':'auMail').focus(), 50);
};
window.closeAuth = function(){ document.getElementById('authModal').classList.remove('on'); };
document.getElementById('authModal').onclick = e => {
  if (e.target === document.getElementById('authModal')) closeAuth();
};

window.switchAuth = function(mode){
  authMode = mode;
  document.getElementById('authTitle').textContent =
    mode === 'register' ? 'Регистрация' : 'Вход';
  document.getElementById('authSubmit').textContent =
    mode === 'register' ? 'Зарегистрироваться' : 'Войти';
  document.getElementById('fgName').style.display =
    mode === 'register' ? '' : 'none';
  document.getElementById('tabReg').classList.toggle('active', mode === 'register');
  document.getElementById('tabLog').classList.toggle('active', mode === 'login');
  document.getElementById('authErr').textContent = '';
};

document.getElementById('authForm').onsubmit = async function(e){
  e.preventDefault();
  const err  = document.getElementById('authErr');
  err.textContent = '';
  const mail = document.getElementById('auMail').value.trim().toLowerCase();
  const pass = document.getElementById('auPass').value;
  const name = document.getElementById('auName').value.trim();

  if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(mail)) { err.textContent = 'Введите корректную почту'; return; }
  if (pass.length < 6) { err.textContent = 'Пароль должен быть не короче 6 символов'; return; }

  try {
    if (authMode === 'register') {
      if (!name) { err.textContent = 'Введите имя пользователя'; return; }
      const cred = await window.__fb.createUserWithEmailAndPassword(window.__auth, mail, pass);
      await window.__fb.updateProfile(cred.user, { displayName: name });
      window.currentUser = { uid: cred.user.uid, email: mail, name };
      window.refreshAuthUI();
      closeAuth();
    } else {
      await window.__fb.signInWithEmailAndPassword(window.__auth, mail, pass);
      closeAuth();
    }
  } catch (ex) {
    const map = {
      'auth/email-already-in-use': 'Пользователь с такой почтой уже существует',
      'auth/invalid-email':        'Некорректная почта',
      'auth/weak-password':        'Слишком слабый пароль',
      'auth/user-not-found':       'Пользователь не найден',
      'auth/wrong-password':       'Неверный пароль',
      'auth/invalid-credential':   'Неверная почта или пароль'
    };
    err.textContent = map[ex.code] || ('Ошибка: ' + ex.message);
  }
};

window.logout = async function(){
  await window.__fb.signOut(window.__auth);
};

window.saveTimeline = async function(){
  if (!window.currentUser) { alert('Сначала войдите в аккаунт'); return; }
  const defName = 'Лента от ' + new Date().toLocaleString('ru-RU');
  const name = prompt('Название ленты:', defName);
  if (name === null) return;
  const title = name.trim() || defName;

  const { collection, addDoc, serverTimestamp, fs } = window.__fs;
  try {
    await addDoc(collection(fs, 'timelines'), {
      uid: window.currentUser.uid,
      name: title,
      data: JSON.parse(JSON.stringify(db)),
      active: activeTrack,
      createdAt: serverTimestamp()
    });
    alert('Лента «' + title + '» сохранена.');
  } catch (e) {
    alert('Ошибка сохранения: ' + e.message);
  }
};

window.openMyTimelines = async function(){
  if (!window.currentUser) { alert('Сначала войдите в аккаунт'); return; }
  const { collection, query, where, getDocs, fs } = window.__fs;
  try {
    const q = query(collection(fs, 'timelines'), where('uid', '==', window.currentUser.uid));
    const snap = await getDocs(q);
    const saved = [];
    snap.forEach(d => saved.push({ id: d.id, ...d.data() }));
    saved.sort((a,b) => (b.createdAt?.seconds||0) - (a.createdAt?.seconds||0));
    renderSavedList(saved);
    document.getElementById('myModal').classList.add('on');
  } catch (e) {
    alert('Ошибка загрузки: ' + e.message);
  }
};

window.closeMy = function(){ document.getElementById('myModal').classList.remove('on'); };
document.getElementById('myModal').onclick = e => {
  if (e.target === document.getElementById('myModal')) closeMy();
};

function renderSavedList(saved){
  const list = document.getElementById('savedList');
  if (!saved.length) {
    list.innerHTML = '<div class="saved-empty">У вас пока нет сохранённых лент.</div>';
    return;
  }
  list.innerHTML = '';
  saved.forEach(item => {
    const wc = (item.data.world||[]).length;
    const rc = (item.data.russia||[]).length;
    const el = document.createElement('div');
    el.className = 'saved-item';
    const dt = item.createdAt?.toDate ? item.createdAt.toDate().toLocaleString('ru-RU') : '';
    el.innerHTML =
      '<div class="si-info"><div class="si-name">' + esc(item.name) + '</div>' +
      '<div class="si-meta">' + dt + ' · мировых: ' + wc + ' · российских: ' + rc + '</div></div>' +
      '<div class="si-actions">' +
      '<button class="si-btn load">Загрузить</button>' +
      '<button class="si-btn del">Удалить</button></div>';

    el.querySelector('.load').onclick = () => {
      if (!confirm('Загрузить «' + item.name + '»? Текущая лента будет заменена.')) return;
      db = JSON.parse(JSON.stringify(item.data));
      if (!Array.isArray(db.world))  db.world  = [];
      if (!Array.isArray(db.russia)) db.russia = [];
      activeTrack = item.active || 'world';
      save(); closeMy(); apply((startYear() + MAX) / 2);
    };
    el.querySelector('.del').onclick = async () => {
      if (!confirm('Удалить сохранённую ленту «' + item.name + '»?')) return;
      const { deleteDoc, doc, fs } = window.__fs;
      try {
        await deleteDoc(doc(fs, 'timelines', item.id));
        openMyTimelines();
      } catch (e) {
        alert('Ошибка удаления: ' + e.message);
      }
    };
    list.appendChild(el);
  });
}

const sidePanel=document.getElementById('sidePanel');
const panelBackdrop=document.getElementById('panelBackdrop');
let panelOpen=false;

window.openPanel=function(id){
  const ev=db.world.concat(db.russia).find(e=>String(e.id)===String(id));
  if(!ev)return;
  const track=(db.world.some(x=>String(x.id)===String(id)))?'world':'russia';
  document.getElementById('spYear').textContent=fmtYear(ev.year);
  document.getElementById('spYear').className='sp-year '+track;
  document.getElementById('spTitle').textContent=ev.title;
  const body=document.getElementById('spBody');
  let html='';
  if(ev.image) html+='<img class="sp-img" src="'+ev.image.replace(/"/g,'&quot;')+'" onerror="this.style.display=\'none\'">';
  const desc=(ev.desc||'').trim();
  html+='<div class="sp-desc'+(desc?'':' empty-desc')+'">'+(desc?esc(desc):'Описание не добавлено.')+'</div>';
  body.innerHTML=html;
  body.scrollTop=0;
  sidePanel.classList.add('on');
  panelBackdrop.classList.add('on');
  sidePanel.setAttribute('aria-hidden','false');
  panelOpen=true;
}
window.closePanel=function(){
  sidePanel.classList.remove('on');
  panelBackdrop.classList.remove('on');
  sidePanel.setAttribute('aria-hidden','true');
  panelOpen=false;
}
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){
    if(panelOpen){closePanel();return}
    if(document.getElementById('authModal').classList.contains('on')){closeAuth();return}
    if(document.getElementById('myModal').classList.contains('on')){closeMy();return}
  }
});

function px(){return Z[zi]}
function xFor(year){return (year-MIN)*px()}
function startYear(){return activeTrack==='russia'?RUSSIA_START:MIN}
function fmtYear(y){
  if(y<0) return Math.abs(y)+' г. до н.э.';
  return y+' г.';
}
function parseYear(){
  const n=parseInt(yEl.value,10);
  if(isNaN(n)) return NaN;
  return eraEl.value==='bce' ? -Math.abs(n) : Math.abs(n);
}
function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function save(){localStorage.setItem('timeline-events',JSON.stringify(db));render()}
function saveState(){localStorage.setItem('timeline-zi',zi);localStorage.setItem('timeline-active',activeTrack)}

function ticks(trackEl, track){
  trackEl.querySelectorAll('.tick,.tick-label').forEach(e=>e.remove());
  const p=px();
  let step=p>=12?100:p>=5?250:p>=2?500:1000;
  if(p>=20)step=50;if(p>=35)step=25;

  const lowerBound = (track === 'russia') ? RUSSIA_START : MIN;
  let startY = Math.ceil(lowerBound / step) * step;
  
  for(let y = startY; y <= MAX; y += step){
    if(y < lowerBound) continue;
    const t=document.createElement('div');
    t.className='tick';
    t.style.left=(SIDE_PADDING + xFor(y))+'px';
    trackEl.appendChild(t);
    if(y === 0) continue;
    const l=document.createElement('div');
    l.className='tick-label';
    l.textContent=fmtYear(y);
    l.style.left=(SIDE_PADDING + xFor(y))+'px';
    trackEl.appendChild(l);
  }
  
  if(track === 'russia'){
    const existing862 = Array.from(trackEl.querySelectorAll('.tick-label')).some(
      el => el.textContent === '862 г.'
    );
    if(!existing862){
      const s=document.createElement('div');
      s.className='tick';
      s.style.left=(SIDE_PADDING + xFor(RUSSIA_START))+'px';
      trackEl.appendChild(s);
      const l=document.createElement('div');
      l.className='tick-label';
      l.textContent='862 г.';
      l.style.left=(SIDE_PADDING + xFor(RUSSIA_START))+'px';
      trackEl.appendChild(l);
    }
  }
}

function renderTrack(track){
  const el=document.getElementById(track+'Track');
  el.querySelectorAll('.card').forEach(e=>e.remove());
  const events=[...db[track]].sort((a,b)=>a.year-b.year);
  events.forEach((ev,idx)=>{
    const c=document.createElement('div');
    c.className='card '+(idx%2===0?'up':'down');
    c.style.left=(SIDE_PADDING + xFor(ev.year))+'px';
    const img=ev.image?'<img class="ci" src="'+ev.image.replace(/"/g,'&quot;')+'" onerror="this.style.display=\'none\'">':'';
    c.innerHTML='<div class="acts"><button class="ib" data-a="e">✎</button><button class="ib del" data-a="d">×</button></div>'+
      img+'<div class="cy">'+fmtYear(ev.year)+'</div><h4 class="ct">'+esc(ev.title)+'</h4>'+
      '<div class="dot"></div>';
    c.querySelector('[data-a="e"]').onclick=e=>{e.stopPropagation();openEv(ev.id)};
    c.querySelector('[data-a="d"]').onclick=e=>{e.stopPropagation();delEv(ev.id)};
    c.onclick=()=>openPanel(ev.id);
    el.appendChild(c);
  });
}

function render(){
  renderTrack('world');renderTrack('russia');
  empty.style.display=(db[activeTrack].length===0?'block':'none');
  const rLine=document.getElementById('russiaLine');
  rLine.style.left=(SIDE_PADDING + xFor(RUSSIA_START))+'px';
  rLine.style.width=((MAX-RUSSIA_START)*px())+'px';
  document.getElementById('worldLine').style.left=SIDE_PADDING+'px';
  document.getElementById('worldLine').style.width=((MAX-MIN)*px())+'px';
  ticks(document.getElementById('worldTrack'),'world');
  ticks(document.getElementById('russiaTrack'),'russia');
}

function apply(centerYear){
  const timelineWidth = (MAX - MIN) * px();
  scene.style.width = timelineWidth + 'px';
  scene.style.height = '680px';
  render();
  if(centerYear !== undefined){
    wrap.scrollLeft = Math.max(0, SIDE_PADDING + xFor(centerYear) - wrap.clientWidth / 2);
  }
  saveState();
}

window.setTrack=function(track){
  activeTrack=track;
  apply((startYear()+MAX)/2);
  saveState();
}
window.zoom=function(d){
  const n=Math.min(Z.length-1,Math.max(0,zi+d));if(n===zi)return;
  const center=MIN+(wrap.scrollLeft - SIDE_PADDING + wrap.clientWidth/2)/px();
  zi=n;apply(center);
}
window.zoomReset=function(){zi=2;apply((startYear()+MAX)/2)}
window.clearTrack=function(){
  const label=activeTrack==='world'?'мировую историю':'историю России';
  if(!db[activeTrack].length)return;
  if(!confirm('Удалить все события из ленты «'+label+'»?'))return;
  db[activeTrack]=[];save();
}

window.openEv=function(id){
  evForm.reset();editingId=null;rm.checked=false;cib.style.display='none';
  if(id!==undefined){
    const ev=db.world.concat(db.russia).find(e=>String(e.id)===String(id));if(!ev)return;
    editingId=ev.id;activeTrack=ev.track||((db.world.some(x=>x.id===ev.id))?'world':'russia');
    mt.textContent='Редактировать событие';sb.textContent='Сохранить изменения';
    trackSelect.value=activeTrack;
    const y=Math.abs(ev.year);yEl.value=y;eraEl.value=ev.year<0?'bce':'ce';
    document.getElementById('t').value=ev.title;document.getElementById('d').value=ev.desc||'';
    if(ev.image){cib.style.display='flex';cip.src=ev.image}
  }else{
    mt.textContent='Новое событие';sb.textContent='Сохранить';trackSelect.value=activeTrack;
  }
  evModal.classList.add('on');
}
window.closeEv=function(){evModal.classList.remove('on');editingId=null}
evModal.onclick=e=>{if(e.target===evModal)closeEv()};

function updateHint(){
  const track=trackSelect.value;
  document.getElementById('yearHint').textContent=track==='russia'
    ? 'Для красной ленты доступны события с 862 г. по 2026 г.'
    : 'Для фиолетовой ленты: от 2000 г. до н.э. до 2026 г.';
  if(track==='russia'){eraEl.value='ce';eraEl.disabled=true}
  else eraEl.disabled=false;
}
trackSelect.onchange=updateHint;eraEl.onchange=updateHint;

evForm.onsubmit=function(e){
  e.preventDefault();
  const track=trackSelect.value,y=parseYear(),t=document.getElementById('t').value.trim(),d=document.getElementById('d').value.trim();
  if(isNaN(y)||y<MIN||y>MAX){alert('Укажите дату от 2000 г. до н.э. до 2026 г.');return}
  if(track==='russia'&&y<RUSSIA_START){alert('История России начинается с 862 г.');return}
  if(!t){alert('Введите заголовок события');return}
  const f=document.getElementById('if'),u=document.getElementById('iu').value.trim(),remove=rm.checked;
  const finish=image=>{
    if(editingId!==null){
      let oldTrack=null,ev=null;
      ['world','russia'].forEach(k=>db[k].forEach(x=>{if(String(x.id)===String(editingId)){oldTrack=k;ev=x}}));
      if(!ev)return;
      db[oldTrack]=db[oldTrack].filter(x=>String(x.id)!==String(editingId));
      ev.year=y;ev.title=t;ev.desc=d;ev.image=image;ev.track=track;
      db[track].push(ev);
    }else{
      db[track].push({id:Date.now()+Math.random(),year:y,title:t,desc:d,image:image,track:track});
    }
    save();closeEv();apply(y);
  };
  if(f.files&&f.files[0]){
    const rd=new FileReader();rd.onload=e=>finish(e.target.result);rd.readAsDataURL(f.files[0]);
  }else if(u)finish(u);
  else if(remove)finish(null);
  else{
    let old=null;
    ['world','russia'].some(k=>db[k].some(x=>{if(String(x.id)===String(editingId)){old=x;return true}return false}));
    finish(old?old.image:null);
  }
};

function delEv(id){
  const track=activeTrack;
  const ev=db[track].find(x=>String(x.id)===String(id));if(!ev)return;
  if(!confirm('Удалить «'+ev.title+'»?'))return;
  db[track]=db[track].filter(x=>String(x.id)!==String(id));save();
}

window.openPdf=function(){
  const evs=db[activeTrack];if(!evs.length){alert('В активной ленте пока нет событий');return}
  const ys=evs.map(e=>e.year);document.getElementById('pf').value=fmtYear(Math.min(...ys));
  document.getElementById('pt').value=fmtYear(Math.max(...ys));updatePi();pdfModal.classList.add('on');
}
window.closePdf=function(){pdfModal.classList.remove('on')}
pdfModal.onclick=e=>{if(e.target===pdfModal)closePdf()}
document.getElementById('pf').oninput=updatePi;document.getElementById('pt').oninput=updatePi;

function parsePdfDate(v){
  v=String(v).trim().toLowerCase();
  const m=v.match(/(-?[\d\s]+)\s*(до\s*н\.?э\.?|н\.?э\.?)?/);
  if(!m)return NaN;
  const n=parseInt(m[1].replace(/\s/g,''),10);if(isNaN(n))return NaN;
  return (m[2]&&m[2].includes('до'))?-Math.abs(n):Math.abs(n);
}
function updatePi(){
  const a=parsePdfDate(document.getElementById('pf').value),b=parsePdfDate(document.getElementById('pt').value);
  document.getElementById('pi').textContent=(isNaN(a)||isNaN(b))?'Введите даты, например «2000 до н.э.» и «2026»':
    'Событий в диапазоне: '+db[activeTrack].filter(e=>e.year>=Math.min(a,b)&&e.year<=Math.max(a,b)).length;
}

window.doExport=function(){
  let f=parsePdfDate(document.getElementById('pf').value),t=parsePdfDate(document.getElementById('pt').value);
  if(isNaN(f)||isNaN(t)){alert('Укажите оба года');return}
  if(f>t)[f,t]=[t,f];
  const list=db[activeTrack].filter(e=>e.year>=f&&e.year<=t).sort((a,b)=>a.year-b.year);
  if(!list.length){alert('Нет событий в диапазоне');return}
  const W=1100,H=500,rl=Math.max(1,t-f),PPY=W/rl;
  const area=document.getElementById('pdfArea');area.innerHTML='';
  const h=document.createElement('h1');h.textContent='Лента времени — '+(activeTrack==='world'?'Мировая история':'История России');
  h.style.cssText='text-align:center;font-family:Segoe UI,Arial;color:#222;margin:0 0 5px;font-size:21px';
  area.appendChild(h);
  const sub=document.createElement('div');sub.textContent=fmtYear(f)+' — '+fmtYear(t)+' · событий: '+list.length;
  sub.style.cssText='text-align:center;color:#888;font-size:11px;margin-bottom:15px';area.appendChild(sub);
  const sc=document.createElement('div');sc.style.cssText='position:relative;width:'+W+'px;height:'+H+'px;margin:0 auto;background:#fafafa;border:1px solid #ddd';
  const ln=document.createElement('div');ln.style.cssText='position:absolute;left:0;top:'+(H/2-2)+'px;width:'+W+'px;height:4px;background:'+(activeTrack==='world'?'#7657ee':'#e45768');sc.appendChild(ln);
  const step=rl<=30?5:rl<=100?10:rl<=300?25:rl<=800?50:rl<=1600?100:250;
  for(let y=Math.ceil(f/step)*step;y<=t;y+=step){
    const x=(y-f)*PPY,tk=document.createElement('div');tk.style.cssText='position:absolute;left:'+x+'px;top:'+(H/2-8)+'px;width:1px;height:16px;background:#777';sc.appendChild(tk);
    if(y === 0) continue;
    const lb=document.createElement('div');lb.textContent=fmtYear(y);lb.style.cssText='position:absolute;left:'+x+'px;top:'+(H/2+12)+'px;transform:translateX(-50%);font-size:8px;color:#666;white-space:nowrap';sc.appendChild(lb);
  }
  list.forEach((ev,idx)=>{
    const x=(ev.year-f)*PPY,c=document.createElement('div');c.style.cssText='position:absolute;left:'+(x-48)+'px;width:96px;padding:5px;background:#fff;border:1px solid #ddd;border-radius:6px;font-family:Segoe UI,Arial;'+(idx%2===0?'bottom:'+(H/2+15)+'px':'top:'+(H/2+15)+'px');
    c.innerHTML='<div style="font-size:8px;color:'+(activeTrack==='world'?'#6246d8':'#c83e52')+';font-weight:700">'+fmtYear(ev.year)+'</div><div style="font-size:9px;font-weight:600;line-height:1.15">'+esc(ev.title)+'</div><div style="font-size:8px;color:#666;line-height:1.15">'+esc(ev.desc||'')+'</div>';
    sc.appendChild(c);
  });
  area.appendChild(sc);setTimeout(()=>window.print(),200);
};

wrap.addEventListener('wheel',e=>{
  if(e.ctrlKey||e.metaKey){e.preventDefault();zoom(e.deltaY<0?1:-1)}
},{passive:false});
let dn=false,sx=0,ss=0;
wrap.addEventListener('mousedown',e=>{
  if(e.target.closest('.card')||e.target.closest('button'))return;
  dn=true;wrap.classList.add('drag');sx=e.pageX;ss=wrap.scrollLeft;
});
window.addEventListener('mouseup',()=>{dn=false;wrap.classList.remove('drag')});
window.addEventListener('mousemove',e=>{if(!dn)return;e.preventDefault();wrap.scrollLeft=ss-(e.pageX-sx)});

apply((startYear()+MAX)/2);
updateHint();
refreshAuthUI();
})();
</script>
</body>
</html>
